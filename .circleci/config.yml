version: 2.1

jobs:
  test-cypress-slack-reporter-old:
    docker:
      - image: cimg/node:20.18
    working_directory: ~/app
    steps:
      - run:
          name: Fetch public repository revision
          command: |
            git init .
            git remote add origin https://github.com/YOU54F/cypress-plugins.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
      - run:
          name: Install legacy reporter dependencies
          command: cd cypress-slack-reporter-old && yarn install --frozen-lockfile
      - run:
          name: Lint, compile, and test
          command: |
            cd cypress-slack-reporter-old
            yarn run lint
            yarn run compile
            yarn run test

workflows:
  build-test:
    jobs:
      - test-cypress-slack-reporter-old
